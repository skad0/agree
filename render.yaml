services:
  - type: web
    name: rafmeshutaf
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci --include=dev --ignore-scripts && npm run build
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: agree-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        value: https://rafmeshutaf.org.il
      - key: SQLITE_PATH
        value: /data/app.db
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUSTED_PROXY
        value: cloudflare
      - key: TRUSTED_PROXY_SECRET
        generateValue: true
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      - key: ERASURE_LEDGER_S3_ENDPOINT
        sync: false
      - key: ERASURE_LEDGER_S3_ACCESS_KEY
        sync: false
      - key: ERASURE_LEDGER_S3_SECRET_KEY
        sync: false
      - key: ERASURE_LEDGER_S3_BUCKET
        sync: false
      - key: ERASURE_LEDGER_S3_REGION
        sync: false
      - key: ERASURE_LEDGER_HMAC_KEYS
        sync: false
      - key: ERASURE_LEDGER_ACTIVE_KEY_VERSION
        sync: false
