name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.13.0, 24.16.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --ignore-scripts
      # Temporary, scoped exception: the known moderate Windows-only serve-static
      # advisory in @hono/node-server is not used by production Linux runtime.
      # Reassess and remove this threshold by 2026-09-30; high/critical remain blocking.
      - run: npm audit --omit=dev --audit-level=high
